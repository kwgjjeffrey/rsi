<!doctype html><html lang="zh"><meta charset="utf-8"><title>RSI 工作台</title><style>body{margin:0;background:#181c22;color:#dce3ed;font:15px system-ui}header{padding:20px;border-bottom:1px solid #39414c}main{display:grid;grid-template-columns:minmax(200px,28%) 1fr;height:85vh}aside{padding:20px;overflow:auto;border-right:1px solid #39414c}article{padding:24px;overflow:auto}button,select{background:#293548;color:inherit;border:1px solid #53647a;padding:9px;margin:4px;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.file{display:block;text-align:left;width:95%;overflow-wrap:anywhere}progress{width:100%;accent-color:#62b9ff} .metric{padding:14px;background:#243044;border-radius:8px;margin:8px 0}small{color:#9eafc5}</style><header><b>RSI · Skill 进化工作台</b> <select id="projects"></select><button id="add">新增项目提示词</button><button id="import">新增问题集提示词</button><button onclick="load()">刷新</button><small id="status"></small></header><main><aside><div id="nav"></div><div id="files"></div></aside><article><h2 id="title">项目概览</h2><pre id="content">加载中</pre></article></main><script>
const token=location.hash.slice(1)||sessionStorage.getItem('rsi-token');if(token)sessionStorage.setItem('rsi-token',token);history.replaceState(null,'',location.pathname);let selected='',all=[];
async function api(v){let r=await fetch('/api',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(v)});let d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
function show(t,v){document.getElementById('title').textContent=t;let c=document.getElementById('content');c.replaceChildren();if(t.endsWith('comparison.json')){try{let d=typeof v==='string'?JSON.parse(v):v;for(let [label,n] of [['基线配对均分',d.baseline_mean],['本轮配对均分',d.round_mean]]){let box=document.createElement('div');box.className='metric';box.textContent=label+'：'+(n??'不可比');if(n!=null){let bar=document.createElement('progress');bar.max=100;bar.value=n;box.append(bar)}c.append(box)}}catch(e){}}let raw=document.createElement('div');raw.textContent=typeof v==='string'?v:JSON.stringify(v,null,2);c.append(raw)}
async function inspect(){selected=projects.value;if(!selected)return;let d=await api({op:'inspect',project:selected});all=d.files;show('项目概览',d.project);render('')}
function render(prefix){files.replaceChildren();for(let f of all.filter(x=>x.path.startsWith(prefix))){let b=document.createElement('button');b.className='file';b.textContent=f.path;b.onclick=async()=>{try{let d=await api({op:'read',project:selected,path:f.path});show(f.path,d.content)}catch(e){show('读取失败',e.message)}};files.append(b)}}
for(let [label,p] of [['全部',''],['Blueprint','blueprint/'],['问题集','datasets/'],['迭代','sprints/']]){let b=document.createElement('button');b.textContent=label;b.onclick=()=>render(p);nav.append(b)}
async function load(){try{let d=await api({op:'list'});projects.replaceChildren();for(let p of d){let o=document.createElement('option');o.value=p.id;o.textContent=p.name||p.id;projects.append(o)}if(selected)projects.value=selected;await inspect();document.getElementById('status').textContent='已连接 · 协议 v1'}catch(e){show('连接失败',e.message)}}
projects.onchange=()=>inspect();document.getElementById('add').onclick=()=>show('复制给 Agent','请使用 RSI 的 onboarding/SKILL.md 接入目标 Skill。确认本地 Git 源码路径、Skill 路径、数据源和优化目标，建立 blueprint 与适配工具；缺少真实 Replay 时明确标为未配置。');document.getElementById('import').onclick=()=>show('复制给 Agent','请使用 RSI 的 datasets/SKILL.md，为项目 '+selected+' 导入新版本问题集。每条记录包含 task_input、trajectory、annotation、reflection；缺少人工标注时阅读轨迹完成标注，保留证据与来源。不得伪造执行。');load();
</script></html>
