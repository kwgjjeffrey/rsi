name: Validate skill project
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 setup/scripts/manage_rsi_runtime.py build --data-dir .data
      - run: npm test --prefix local-runtime/frontend
      - run: python3 -m unittest discover -s tests
